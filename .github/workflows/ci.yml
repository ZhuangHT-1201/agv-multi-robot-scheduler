name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ./ecbs_standalone

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate C++ ECBS bindings
        run: python algorithms/check_ecbs.py

      - name: Run small-fleet integration test
        env:
          HEADLESS_FAST: "1"
        run: python algorithms/headless_test.py swap 600
